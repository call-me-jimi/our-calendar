# Server overlay (P7, docs/runbooks/deploy.md), run by infra/scripts/server.sh as
#   GIT_SHA=<sha> docker compose --env-file /srv/wannpassts/.env -p wannpassts \
#     -f compose.yaml -f compose.prod.yaml …
# The image comes from the laptop (`docker save | ssh docker load`): nothing is built or
# pulled for it here. No SMTP: production sends no mail (decisions.md, P7).

services:
  app:
    image: wannpassts:${GIT_SHA:?GIT_SHA names the image to run}
    pull_policy: never
    environment:
      # BASE_URL comes from the .env, as https://${DOMAIN} (infra/server/env.example).
      HOLIDAY_SYNC: "true"
    volumes:
      # A bind mount (replaces the app_data volume), so the host's nightly
      # `sqlite3 .backup` finds the database at a fixed path, and `docker compose down -v`
      # can't delete it. Owned by the app's uid 10001 (cloud-init, server.sh deploy).
      - /srv/wannpassts/data:/data
    healthcheck:  # the image's check, polled every 2 s while starting
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 2s
      retries: 3

  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in /srv/wannpassts/.env}
      ACME_EMAIL_OPTION: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      # Caddyfile.prod's redirect site: OLD_DOMAIN, or else a loopback port nothing uses.
      REDIRECT_FROM: ${OLD_DOMAIN:-http://127.0.0.1:8082}
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./caddy/headers.caddy:/etc/caddy/headers.caddy:ro
      - caddy_logs:/var/log/caddy
    healthcheck:  # Caddyfile.prod's loopback-only site
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 2s
      retries: 3

volumes:
  caddy_logs:
